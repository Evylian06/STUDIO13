<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel administrativo | Studio 13</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="config-warn" class="admin-wrap config-warn" hidden></div>

  <section id="auth-view" class="admin-wrap">
    <div class="auth-card">
      <h2>Studio 13 — Admin</h2>
      <p>Inicia sesión para gestionar fotografías y obras de Colorimetría.</p>
      <form id="login-form">
        <label>
          Correo
          <input type="email" id="login-email" autocomplete="username" required>
        </label>
        <label>
          Contraseña
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary" style="width:100%">Entrar</button>
        <p id="auth-message" class="message" hidden></p>
      </form>
    </div>
  </section>

  <div id="app-view" hidden>
    <header class="admin-header">
      <div>
        <h1>Panel administrativo</h1>
        <p>Imágenes en Cloudinary · datos en Supabase</p>
      </div>
      <button type="button" class="btn btn-ghost" id="btn-logout">Cerrar sesión</button>
    </header>

    <div class="admin-wrap">
      <div class="tabs-admin" role="tablist">
        <button type="button" class="active" data-section="studio13">Studio 13 — Fotos</button>
        <button type="button" data-section="colorimetria">Colorimetría</button>
      </div>

      <div class="toolbar">
        <button type="button" class="btn btn-primary" id="btn-new">+ Nueva imagen</button>
        <a class="btn btn-ghost" href="../index.html" target="_blank" rel="noopener">Ver sitio</a>
      </div>

      <p id="list-message" class="message" hidden></p>
      <div id="item-list" class="item-list"></div>
    </div>
  </div>

  <div id="item-modal" class="modal" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Nueva imagen</h2>
      <form id="item-form">
        <label>
          Sección
          <select id="item-section" required>
            <option value="studio13">Studio 13 — Fotografías</option>
            <option value="colorimetria">Colorimetría Amazónica</option>
          </select>
        </label>
        <label>
          Categoría
          <select id="item-category" required></select>
        </label>
        <label>
          Título *
          <input type="text" id="item-title" required maxlength="200">
        </label>
        <label>
          Etiqueta corta (opcional)
          <input type="text" id="item-tag" placeholder="Ej: Retrato, Boda y social">
        </label>
        <label>
          Descripción
          <textarea id="item-description" placeholder="Texto para accesibilidad o detalle"></textarea>
        </label>
        <label id="field-technique">
          Técnica (Colorimetría)
          <input type="text" id="item-technique" placeholder="Ej: Óleo sobre lienzo">
        </label>
        <label id="field-artist">
          Artista
          <input type="text" id="item-artist">
        </label>
        <label id="field-layout">
          Diseño en portada (Studio 13)
          <select id="item-layout">
            <option value="">Normal</option>
            <option value="wide">Ancho (wide)</option>
            <option value="tall">Alto (tall)</option>
            <option value="color-card">Tarjeta color</option>
          </select>
        </label>
        <label>
          Orden
          <input type="number" id="item-sort" value="0" min="0" step="1">
        </label>
        <label id="field-image">
          Imagen *
          <input type="file" id="item-image" accept="image/jpeg,image/png,image/webp,image/gif">
          <img id="image-preview" class="preview-img" alt="" hidden>
        </label>
        <label style="display:flex;align-items:center;gap:8px;margin-top:8px">
          <input type="checkbox" id="item-published" checked>
          Publicado en la web
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="btn-save">Guardar</button>
          <button type="button" class="btn btn-ghost" id="btn-cancel">Cancelar</button>
        </div>
        <p id="form-message" class="message" hidden></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/cloudinary-config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/cloudinary-client.js"></script>
  <script src="admin.js"></script>
</body>
</html>
